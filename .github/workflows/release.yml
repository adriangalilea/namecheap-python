name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    uses: adriangalilea/ci/.github/workflows/python.yml@5afd9365125449d69deb51e9e5ab2980260832fe # v1.10.1
    permissions:
      contents: read

  publish:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  release:
    needs: [build, publish]
    uses: adriangalilea/ci/.github/workflows/release.yml@5afd9365125449d69deb51e9e5ab2980260832fe # v1.10.1
    with:
      tag: ${{ needs.build.outputs.tag }}
    permissions:
      contents: write
