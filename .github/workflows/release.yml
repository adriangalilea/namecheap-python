name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    uses: adriangalilea/ci/.github/workflows/python.yml@20e2e8a8bd1799eb57e9852347c2f93540ab51cd # v1.10.2
    permissions:
      contents: read

  publish:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  release:
    needs: [build, publish]
    uses: adriangalilea/ci/.github/workflows/release.yml@20e2e8a8bd1799eb57e9852347c2f93540ab51cd # v1.10.2
    with:
      tag: ${{ needs.build.outputs.tag }}
    permissions:
      contents: write
